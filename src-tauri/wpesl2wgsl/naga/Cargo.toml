# Kabegame 修改，见 KABEGAME.md
# 底本是 crates.io 上 naga 30.0.1 规范化后的 Cargo.toml（没有工作区继承）。
# 删掉了 SPIR-V / MSL / HLSL / GLSL / dot 后端与 SPIR-V 前端的 feature 及其专用依赖、上游集成测试才用的 dev 依赖。
# 不声明 [workspace]：本目录在仓库工作区里，作为翻译器的路径依赖自动成为工作区成员。

[package]
edition = "2021"
rust-version = "1.87"
name = "naga"
version = "30.0.1"
authors = ["gfx-rs developers"]
build = "build.rs"
publish = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Shader translator and validator. Part of the wgpu project"
keywords = [
    "shader",
    "SPIR-V",
    "GLSL",
    "MSL",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/gfx-rs/wgpu"

[package.metadata.docs.rs]
all-features = true

[features]
arbitrary = [
    "dep:arbitrary",
    "bitflags/arbitrary",
    "half/arbitrary",
    "half/std",
    "naga-types/arbitrary",
]
default = []
deserialize = [
    "dep:serde",
    "bitflags/serde",
    "half/serde",
    "hashbrown/serde",
    "naga-types/deserialize",
]
glsl-in = ["dep:pp-rs"]
serialize = [
    "dep:serde",
    "bitflags/serde",
    "half/serde",
    "hashbrown/serde",
    "naga-types/serialize",
]
stderr = ["codespan-reporting/std"]
termcolor = ["codespan-reporting/termcolor"]
wgsl-in = ["dep:unicode-ident"]
wgsl-out = []

[lib]
name = "naga"
path = "src/lib.rs"

[dependencies.arbitrary]
version = "1.4.2"
features = ["derive"]
optional = true

[dependencies.arrayvec]
version = "0.7.1"
default-features = false

[dependencies.bit-set]
version = "0.10"
default-features = false

[dependencies.bitflags]
version = "2.9"

[dependencies.cfg-if]
version = "1"

[dependencies.codespan-reporting]
version = "0.13"
default-features = false

[dependencies.half]
version = "2.5"
features = ["num-traits"]
default-features = false

[dependencies.hashbrown]
version = "0.17"
features = [
    "default-hasher",
    "inline-more",
]
default-features = false

[dependencies.indexmap]
version = "2.11.4"
default-features = false

[dependencies.libm]
version = "0.2.6"
default-features = false

[dependencies.log]
version = "0.4.29"

# 修改：钉死与嵌入版本相同的 naga-types（上游写的是 "30.0.0"）
[dependencies.naga-types]
version = "=30.0.1"

[dependencies.num-traits]
version = "0.2.16"
default-features = false

[dependencies.once_cell]
version = "1.21"
features = [
    "alloc",
    "race",
]
default-features = false

[dependencies.pp-rs]
version = "0.2.1"
optional = true

[dependencies.rustc-hash]
version = "1.1"
default-features = false

[dependencies.serde]
version = "1.0.225"
features = [
    "alloc",
    "derive",
]
optional = true
default-features = false

[dependencies.thiserror]
version = "2.0.12"
default-features = false

[dependencies.unicode-ident]
version = "1.0.5"
optional = true

# 只留 src 里内联单测用到的（front/wgsl 的 diff、strum）
[dev-dependencies.diff]
version = "0.1"

[dev-dependencies.strum]
version = "0.28"
features = ["derive"]
default-features = false

[build-dependencies.cfg_aliases]
version = "0.2.2"

[lints.clippy]
alloc_instead_of_core = "warn"
std_instead_of_alloc = "warn"
std_instead_of_core = "warn"

[lints.rust]
missing_debug_implementations = "warn"
