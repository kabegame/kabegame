[package]
name = "wpesl2wgsl"
version.workspace = true
edition.workspace = true
description = "Wallpaper Engine shader language (WPESL) -> WGSL translator, compiled to wasm for the scene renderer"
publish = false

[lib]
# cdylib：`deno task build:wpesl2wgsl` 编到 wasm32-unknown-unknown；rlib：原生 cargo test
crate-type = ["cdylib", "rlib"]

[dependencies]
# naga 源码嵌在本目录（naga/KABEGAME.md），只开 GLSL 前端与 WGSL 后端
naga = { path = "naga", default-features = false, features = ["glsl-in", "wgsl-out"] }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# 语料测试与单测把输出的 WGSL 再解析、校验一遍，要 WGSL 前端；
# resolver 2 下 dev 依赖的 feature 不进 wasm 构建
naga = { path = "naga", default-features = false, features = ["glsl-in", "wgsl-out", "wgsl-in"] }
