[package]
build = "build.rs"
description = "Kabegame 共享后端核心（crawler/plugin/storage 等）"
edition = { workspace = true }
name = "kabegame-core"
version = { workspace = true }

[dependencies]
kabegame-i18n = { workspace = true }
pathql-rs = { workspace = true, features = ["json5", "yaml", "validate"] }
include_dir = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
auto-launch = "0.6"
base64 = { workspace = true }
bzip2 = { workspace = true }
dirs = "5.0"
chrono = "0.4"
futures-util = "0.3"
flate2 = { workspace = true }
globset = { workspace = true }
image = { workspace = true }
infer = "0.22"
kamadak-exif = { workspace = true }
regex = "1.11"
r2d2 = "0.8"
r2d2_sqlite = "0.35"
rusqlite = { version = "0.40", features = ["bundled", "functions", "hooks", "trace"] }
serde = { workspace = true }
serde_bytes = { workspace = true }
serde_cbor = { workspace = true }
serde_json = { workspace = true }
sevenz-rust2 = { workspace = true }
semver = "1"
sha2 = { workspace = true }
tar = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
tracing = { workspace = true }
tracing-appender = { workspace = true }
tracing-log = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
urlencoding = "2.1"
uuid = { workspace = true }
walkdir = "2"
zip = { workspace = true }

# 从 Steam 拉取 WPE（`wpe::steam`，只随 `wpe` feature）：CM 连接用 steam-vent（MIT，自带 WebSocket 与 protobuf），
# 登录经 HTTPS 调 IAuthenticationService；CDN 的解密 / 解压 / 校验自己做。zstd 用纯 Rust 的 ruzstd（仓库禁止链 C 的 zstd）。
steam-vent = { version = "0.5", optional = true }
steam-vent-proto-steam = { version = "0.5.2", optional = true }
steam-vent-proto-common = { version = "0.5.1", optional = true }
rsa = { version = "0.9", features = ["getrandom"], optional = true }
aes = { version = "0.8", optional = true }
sha1 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
lzma-rust2 = { version = "0.16", optional = true }
ruzstd = { version = "0.8", optional = true }
qrcode = { version = "0.14", default-features = false, features = ["image"], optional = true }

# 桌面端与移动端实际都用 native-tls（移动端原因见下方移动端 reqwest 说明）。
# native-tls-alpn：握手时声明 h2，让桌面请求能与 rustls 一样协商 HTTP/2（native-tls 默认不带 ALPN，
# 只能走 HTTP/1.1；插件设桌面 Chrome UA 时，Cloudflare 对「Chrome UA + HTTP/1.1」会下发 challenge，
# 头名首字母大写也救不回来，实测只有 h2 稳定放行）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
reqwest = { version = "0.11", features = [
  "blocking",
  "gzip",
  "json",
  "stream",
  "native-tls",
  "native-tls-alpn",
] }
# 桌面端删除原始文件时移入系统回收站（可恢复）；Android/iOS 不支持，单独处理。
trash = "5"
# V8_RUNTIME：嵌入式 V8 (deno_core/rusty_v8) 插件运行时。
# 桌面 + Android 均接入（仅排除 iOS）。每个任务直接初始化独立 runtime；
# 网络全部走宿主 reqwest（op_kabegame_fetch / op_kabegame_to），
# Response/Headers 由 prelude.js 自实现，故不引入 deno_fetch / deno_net / deno_tls。
[target.'cfg(not(target_os = "ios"))'.dependencies]
# 进程内 FFmpeg：视频预览压缩 + 维度读取。桌面 + Android 均接入（仅排除 iOS）。
# 链接依赖构建环境 FFMPEG_PKG_CONFIG_PATH 指向对应平台的 FFmpeg-build install/lib/pkgconfig
# （统一位于 bin/{platform}/{arch}/FFmpeg-build/install，Android 架构 token 为 arm64）。
# Android content:// 视频经 ContentIoProvider.open_fd 拿 fd，Rust 用 file 协议打开 /proc/self/fd/N。
rsmpeg = { workspace = true }
# embed_ext_sources：kabegame 补丁 feature（third/deno libs/core），无快照运行时将扩展 JS
# 内嵌进二进制（Android 交叉编译必需）；feature 默认关闭，未启用时保持上游行为。
deno_core = { version = "0.405", optional = true, features = ["embed_ext_sources"] }
deno_error = { version = "0.7", optional = true }
deno_webidl = { version = "0.252", optional = true }
deno_web = { version = "0.283", optional = true }
deno_crypto = { version = "0.266", optional = true }
deno_fs = { version = "0.162", features = ["sync_fs"], optional = true }
deno_io = { version = "0.162", optional = true }
deno_permissions = { version = "0.111", optional = true }
deno_features = { version = "0.49", optional = true }
sys_traits = { version = "0.1", features = ["real", "libc", "winapi"], optional = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# 未关默认 feature，default-tls（native-tls → vendored OpenSSL）与 rustls-tls 同时启用时
# reqwest 默认选 native-tls，所以移动端实际走的是 OpenSSL。必须带 native-tls-alpn 声明 h2：
# 否则只能走 HTTP/1.1，插件设桌面 Chrome UA 时 Cloudflare 直接下发 challenge（403）。
reqwest = { version = "0.11", features = [
  "blocking",
  "gzip",
  "json",
  "stream",
  "rustls-tls",
  "native-tls-alpn",
] }

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"

# Android 交叉编译时无系统 OpenSSL，使用 vendored 从源码编译
[target.'cfg(target_os = "android")'.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.52", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_IO",
  "Win32_System_Memory",
  "Win32_System_Threading",
] }

[features]
default = ["ipc-client", "plugin-runtime", "wpe"]
# Wallpaper Engine 壁纸的发现、导入与内建插件 wpe-import。桌面主程序与 CLI 开启，Android / Web 不开；
# 依赖方都是 default-features = false，放进 default 只为让 core 单独测试时覆盖这部分。
wpe = [
  "dep:steam-vent",
  "dep:steam-vent-proto-steam",
  "dep:steam-vent-proto-common",
  "dep:rsa",
  "dep:aes",
  "dep:sha1",
  "dep:hex",
  "dep:lzma-rust2",
  "dep:ruzstd",
  "dep:qrcode",
]
ipc-client = []
ipc-server = []
plugin-runtime = [
  "dep:deno_core",
  "dep:deno_error",
  "dep:deno_webidl",
  "dep:deno_web",
  "dep:deno_crypto",
  "dep:deno_fs",
  "dep:deno_io",
  "dep:deno_permissions",
  "dep:deno_features",
  "dep:sys_traits",
]

[dev-dependencies]
tempfile = "3"
# `#[tokio::test(start_paused = true)]` 需要 test-util（workspace 的 "full" 不含它）。
tokio = { workspace = true, features = ["test-util"] }
