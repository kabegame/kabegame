namespace: kabegame
name: albums_search_provider
note: >-
  Albums whose subtree (the album itself or any descendant) has a name or label path containing
  the query (ASCII case-insensitive). Keeps the tree shape: ancestors of a match stay, branches
  without a match drop out. Combine with roots / parent/<id> to filter one tree level.
properties:
  query: { type: string, default: "", optional: false }
query:
  # 自身或子孙命中：子树（含自身）是 ancestor_path 以本画册路径为前缀的一段区间，走 idx_albums_ancestor_path，
  # 每行只扫自己的子树，不做全表扫描。instr 做子串匹配，% _ \ 按字面处理；label_path 已含 label_key。
  # 同一句的 child 版本在 albums_child_search_provider（~~/children/search/<q>）。
  where: |-
    EXISTS (
      SELECT 1 FROM albums AS hit
      WHERE hit.ancestor_path >= albums.ancestor_path
        AND hit.ancestor_path < substr(albums.ancestor_path, 1, length(albums.ancestor_path) - 1) || '0'
        AND (
          instr(LOWER(hit.name), LOWER(${properties.query})) > 0
          OR instr(LOWER(COALESCE(hit.label_path, '')), LOWER(${properties.query})) > 0
        )
    )
resolve:
  ".*":
    delegate: { provider: albums_filter_router }
    child_var: child
    provider: "${child.provider}"
    meta: "${child.meta}"
