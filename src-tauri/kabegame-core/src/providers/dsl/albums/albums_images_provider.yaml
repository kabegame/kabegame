namespace: kabegame
name: albums_images_provider
note: >-
  Image counts of the albums selected so far, including their descendants (a label leaf counts
  its own images). Use after ~~ so a page is cut first: .../x<N>x/<page>/~~/images. Fetch returns
  one row per album that has at least one image, with image_count = its member-row count (the
  same as images://gallery/album-tree/<id>); albums without images have no row. Append /hide to
  leave out images in the hidden album.
query:
  fields:
    - { sql: COUNT(images.id), as: image_count, in_need: true }
  join:
    # 子树成员（含自身，所以标签叶子即直接成员）：ancestor_path 为 `/根/.../自身/`，
    # 后代的路径以它为前缀，写成索引上的一段区间（`/` 的下一个字符是 `0`），走 idx_albums_ancestor_path。
    - kind: INNER
      table: albums
      as: tree
      "on": >-
        tree.ancestor_path >= albums.ancestor_path
        AND tree.ancestor_path < substr(albums.ancestor_path, 1, length(albums.ancestor_path) - 1) || '0'
      in_need: true
    - { kind: INNER, table: album_images, as: tree_ai, "on": tree_ai.album_id = tree.id, in_need: true }
    - { kind: INNER, table: images, as: images, "on": images.id = tree_ai.image_id, in_need: true }
    # 与 gallery_route 同名同条件，hide 段因此可以写成与画廊一样的谓词。
    - kind: LEFT
      table: album_images
      as: hid_ai
      "on": "images.id = hid_ai.image_id and hid_ai.album_id = ${global.hidden_album_id}"
      in_need: true
  group_by: [albums.id]
resolve:
  hide: { provider: albums_images_hide_provider }
