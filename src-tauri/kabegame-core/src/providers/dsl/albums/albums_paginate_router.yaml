namespace: kabegame
name: albums_paginate_router
note: >-
  Pages of the albums selected so far, oldest first (created_at, then id). Next segment is the
  page number; fetch it for that page's album rows. Append /~~/images[/hide] or /~~/children/... to count
  per album on that page only.
properties:
  page_size: { type: number, default: 100, min: 1, optional: false }
query:
  # 默认按创建时间（与画册树原先按父目录列子画册的顺序一致），id 兜底保证翻页稳定；
  # 专门的排序功能以后单独做。追加而非 clear：上游若贡献排序项仍排在前面。
  order:
    - { sql: albums.created_at, order: asc }
    - { sql: albums.id, order: asc }
list:
  # 页号按上游行数枚举（空结果也保留第 1 页）。
  "${out.name}":
    delegate:
      provider: page_size_provider
      properties: { page_size: "${properties.page_size}" }
    child_var: out
    provider: query_page_provider
    properties:
      page_size: "${properties.page_size}"
      page_num: "${out.meta.page_num}"
resolve:
  # 动态列举的兜底（RULES §4.0）：越过末页的页号直接实例化分页节点，取行为空而不是 path not found。
  "([1-9][0-9]*)":
    provider: query_page_provider
    properties:
      page_size: "${properties.page_size}"
      page_num: "${capture[1]}"
