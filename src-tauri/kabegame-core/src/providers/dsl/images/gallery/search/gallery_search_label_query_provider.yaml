namespace: kabegame
name: gallery_search_label_query_provider
properties:
  query: { type: string, default: "", optional: false }
query:
  # 单个条件只负责一次大小写不敏感的完整标签路径子串匹配。多个输入词的 AND 语义由前端
  # 拆成多个 search/label/<token>，经 filter_comb 让 PathQL 累积多条 WHERE，不在 SQL 中分词。
  # 图片只挂在叶子标签上；label_path 已包含全部祖先 key，例如 pixiv/character/umi。
  where: |-
    EXISTS (
      SELECT 1
      FROM album_images lai
      JOIN albums la ON la.id = lai.album_id AND la.type = 'label'
      WHERE lai.image_id = images.id
        AND instr(LOWER(COALESCE(la.label_path, '')), LOWER(${properties.query})) > 0
    )
resolve:
  ".*":
    delegate: { provider: gallery_route }
    child_var: child
    provider: "${child.provider}"
    meta: "${child.meta}"
