namespace: kabegame
name: gallery_aspect_router
note: >-
  Filter by aspect ratio (width / height). Listing returns the app's five buckets with each
  bucket's image count in meta.count: 4x3-16x9 (landscape), 16x9- (widescreen), 3x4-4x3
  (square-ish), -3x4 (portrait) and unknown; together they cover every image. Any other range can
  still be written directly as a segment. Ratios are written <w>x<h> with positive integers; ranges
  are left-open and right-closed, so adjacent ranges never overlap. -9x16 = at most 9:16; 9x16-3x4
  = above 9:16 and at most 3:4; 7x3- = above 7:3; unknown = width or height missing or not
  positive. The legacy dimension and dimensions entry points are aliases of aspect.
# 列举应用的五个桶（与前端 GALLERY_ASPECT_BUCKETS、VD 同一组、同一顺序），计数放进 meta.count：
# - 四个区间桶：一条 SQL 在上游结果集上按 CASE 分组计数（一次扫描），再与固定桶表 LEFT JOIN 补 0。
#   CASE 用与 aspect_range_provider 相同的整数交叉乘法和左开右闭边界，有效性同样看 aspect_ratio；
#   改一处同步另一处。
# - unknown 单独一项：动态列举项的 provider 名不能按行切换，而它走的是 gallery_aspect_unknown_router。
#   谓词与 aspect_unknown_provider 相同（aspect_ratio IS NULL，可走索引）。
# 段名解析走下方 resolve，不跑这些 SQL。
list:
  "${out.bucket}":
    sql: |-
      SELECT b.bucket AS bucket, b.min_w AS min_w, b.min_h AS min_h, b.max_w AS max_w, b.max_h AS max_h,
        COALESCE(c.count, 0) AS count
      FROM (
        SELECT 0 AS ord, '4x3-16x9' AS bucket, 4 AS min_w, 3 AS min_h, 16 AS max_w, 9 AS max_h
        UNION ALL SELECT 1, '16x9-', 16, 9, 1, 0
        UNION ALL SELECT 2, '3x4-4x3', 3, 4, 4, 3
        UNION ALL SELECT 3, '-3x4', 0, 1, 3, 4
      ) AS b
      LEFT JOIN (
        SELECT
          CASE
            WHEN sub.width * 4 <= sub.height * 3 THEN '-3x4'
            WHEN sub.width * 3 <= sub.height * 4 THEN '3x4-4x3'
            WHEN sub.width * 9 <= sub.height * 16 THEN '4x3-16x9'
            ELSE '16x9-'
          END AS bucket,
          COUNT(*) AS count
        FROM (${composed}) AS sub
        WHERE sub.aspect_ratio IS NOT NULL
        GROUP BY bucket
      ) AS c ON c.bucket = b.bucket
      ORDER BY b.ord
    data_var: out
    provider: gallery_aspect_bucket_router
    properties:
      min_w: "${out.min_w}"
      min_h: "${out.min_h}"
      max_w: "${out.max_w}"
      max_h: "${out.max_h}"
    meta:
      count: "${out.count}"
  "${unknown.bucket}":
    sql: |-
      SELECT 'unknown' AS bucket, COUNT(*) AS count FROM (${composed}) AS sub WHERE sub.aspect_ratio IS NULL
    data_var: unknown
    provider: gallery_aspect_unknown_router
    meta:
      count: "${unknown.count}"
# 任意区间：四种段型对应 aspect_range_provider 的上下界：缺下界补 0x1，缺上界补 1x0（∞），见该 provider 注释。
resolve:
  "-([1-9][0-9]*)x([1-9][0-9]*)":
    provider: gallery_aspect_bucket_router
    properties: { min_w: 0, min_h: 1, max_w: "${capture[1]}", max_h: "${capture[2]}" }
  "([1-9][0-9]*)x([1-9][0-9]*)-([1-9][0-9]*)x([1-9][0-9]*)":
    provider: gallery_aspect_bucket_router
    properties:
      min_w: "${capture[1]}"
      min_h: "${capture[2]}"
      max_w: "${capture[3]}"
      max_h: "${capture[4]}"
  "([1-9][0-9]*)x([1-9][0-9]*)-":
    provider: gallery_aspect_bucket_router
    properties: { min_w: "${capture[1]}", min_h: "${capture[2]}", max_w: 1, max_h: 0 }
  unknown:
    provider: gallery_aspect_unknown_router
