namespace: kabegame
name: run_configs_paginate_router
note: Pages of run configs ordered by created_at descending and id descending.
properties:
  page_size: { type: number, default: 20, min: 1, optional: false }
query:
  order:
    - { sql: run_configs.created_at, order: desc }
    - { sql: run_configs.id, order: desc }
list:
  "${row.name}":
    delegate:
      provider: page_size_provider
      properties: { page_size: "${properties.page_size}" }
    child_var: row
    provider: query_page_provider
    properties:
      page_size: "${properties.page_size}"
      page_num: "${row.meta.page_num}"
resolve:
  "([1-9][0-9]*)":
    provider: query_page_provider
    properties:
      page_size: "${properties.page_size}"
      page_num: "${capture[1]}"
