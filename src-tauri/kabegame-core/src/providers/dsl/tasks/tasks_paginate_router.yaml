namespace: kabegame
name: tasks_paginate_router
note: Pages of tasks ordered by start_time descending and id descending.
properties:
  page_size: { type: number, default: 20, min: 1, optional: false }
query:
  order:
    - { sql: "COALESCE(tasks.start_time, 0)", order: desc }
    - { sql: tasks.id, order: desc }
list:
  "${row.name}":
    delegate:
      provider: page_size_provider
      properties: { page_size: "${properties.page_size}" }
    child_var: row
    provider: query_page_provider
    properties:
      page_size: "${properties.page_size}"
      page_num: "${row.meta.page_num}"
resolve:
  "([1-9][0-9]*)":
    provider: query_page_provider
    properties:
      page_size: "${properties.page_size}"
      page_num: "${capture[1]}"
