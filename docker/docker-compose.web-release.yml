# 本地构建 kabegame web 二进制，产物输出到 dist-web/kabegame
#
# 用法：
#   docker compose -f docker/docker-compose.web-release.yml build          # 首次 / 依赖或 third 子模块变更后
#   docker compose -f docker/docker-compose.web-release.yml run --rm build # 日常：只跑最后一步构建
#
# 前置（宿主）：git submodule update --init third/deno third/FFmpeg third/x264
#   且 third/deno 已应用补丁（deno task patch deno）。
#
# 分工：
#   镜像构建（web-release.Dockerfile，多阶段）：自编 deno（0004 后缀补丁）、x264+FFmpeg
#     静态库（-web 后缀）、`deno install --frozen` 出 node_modules-web 种子——全部烘进镜像层，
#     清单/子模块不变时全缓存。deno.lock 变更后需重新 `build`（运行时 entrypoint 会告警）。
#   运行（本文件 command）：只剩 `deno task b -c kabegame --mode web`。镜像 entrypoint
#     （web-release-entrypoint.sh）先把种子 rsync 进 /src——FFmpeg/x264 → third/*-build-web/
#     install/、node_modules-web 按清单——再执行 command。
#
# 编译隔离（镜像 ENV 注入，与宿主/其它 glibc 环境互不污染）：
#   CARGO_TARGET_DIR=/src/target-web    （宿主 target-web/，跨 run 增量复用）
#   DENO_NODE_MODULES_SUFFIX=-web       （node_modules → node_modules-web，种子来自镜像）
#   KB_BUILD_SUFFIX=-web                （FFmpeg/x264 产物目录带 -web 后缀）
#
# 产物路径（宿主机）：dist-web/kabegame
# 部署到服务器：bash scripts/deploy-web.sh（demo.kabegame.com，见脚本头注）

services:
  build:
    image: ${KABEGAME_WEB_BUILD_IMAGE:-kabegame-web-release:latest}
    # 部署目标（cmtheit.com）是 x86_64——必须钉死平台，否则在 Apple Silicon 上
    # 默认起 arm64 容器，编出 aarch64 二进制传上去跑不了。
    # x86_64 Linux 宿主上此项为 no-op；Mac 上走 Rosetta/QEMU 模拟（慢但产物正确）。
    platform: linux/amd64
    build:
      context: ..
      dockerfile: docker/web-release.Dockerfile
    working_dir: /src
    stdin_open: true
    tty: false
    volumes:
      # 整个仓库树 bind-mount 到 /src（含 third/ 子模块）。镜像内预制产物由 entrypoint
      # 种回该树的 gitignored 路径（third/*-build-web/、node_modules-web/）。
      - ..:/src
      - ../dist-web:/dist
    command:
      - bash
      - -lc
      - >-
        deno task b -c kabegame --mode web
        && mkdir -p /dist
        && cp target-web/release/kabegame /dist/kabegame
        && echo "✓ 产物已写入 /dist/kabegame"
